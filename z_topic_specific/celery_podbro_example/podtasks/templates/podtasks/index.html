<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f5f4f0; font-family: Georgia, serif; color: #1a1a1a; padding: 2rem; }
    .card { background: #fff; border: 1px solid #e0ddd6; padding: 2.5rem; width: 100%; max-width: 540px; }
    h1 { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 2rem; font-weight: normal; }
    h2 { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: #999; font-weight: normal; margin: 1.5rem 0 1rem; }
    label { display: block; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 0.4rem; }
    input, textarea { width: 100%; border: 1px solid #e0ddd6; background: #fafaf8; padding: 0.6rem 0.75rem; font-family: inherit; font-size: 0.9rem; color: #1a1a1a; outline: none; transition: border-color 0.2s; margin-bottom: 0.5rem; }
    input:focus, textarea:focus { border-color: #1a1a1a; }
    textarea { resize: vertical; min-height: 100px; }
    button { width: 100%; padding: 0.75rem; background: #1a1a1a; color: #f5f4f0; border: none; font-family: inherit; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #444; }
    hr { border: none; border-top: 1px solid #e0ddd6; margin: 1.5rem 0 0; }
    ul { list-style: none; }
    li { font-size: 0.88rem; padding: 0.4rem 0; border-bottom: 1px solid #f0ede8; }
    small { color: #aaa; }
    p { font-size: 0.88rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Submit Content</h1>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <label>Files (up to 4)</label>
      <input type="file" name="files" multiple>
      <label>URLs (up to 4)</label>
      <input type="url" name="url_1" placeholder="https://...">
      <input type="url" name="url_2" placeholder="https://...">
      <input type="url" name="url_3" placeholder="https://...">
      <input type="url" name="url_4" placeholder="https://...">
      <label>Content</label>
      <textarea name="content" placeholder="Write something..."></textarea>
      <button type="submit">Submit</button>
    </form>

    <hr>
    <h2>Podcasts</h2>
    {% if podcasts %}
    <ul>
      {% for podcast in podcasts %}
      <li><strong>{{ podcast.title }}</strong> — ID: {{ podcast.id }} {% if podcast.task_id %}<small>(Task: {{ podcast.task_id }})</small>{% endif %}</li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No podcasts yet.</p>
    {% endif %}
  </div>
</body>
</html>
